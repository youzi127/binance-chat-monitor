[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "binance-chat-api"
version = "0.5.0"
description = "Unofficial, session-based Python client and FastAPI wrapper for Binance Square Chat"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Local project" }]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.5,<3",
  "uvicorn[standard]>=0.30,<1",
  "websockets>=14,<16",
]

[project.optional-dependencies]
browser = ["playwright>=1.48,<2"]
crypto = ["cryptography>=43,<47"]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.8,<1",
]

[project.scripts]
binance-chat = "binance_chat_api.cli:main"
bnchat = "binance_chat_api.agent_cli:main"
bnchat-monitor = "binance_chat_api.monitor_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/binance_chat_api"]
artifacts = ["src/binance_chat_api/webui"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
